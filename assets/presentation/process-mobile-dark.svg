<svg xmlns="http://www.w3.org/2000/svg" width="400" height="685" viewBox="0 0 400 685" data-palette="e6a856-dae76a-f6bbac-0235c8c0c05f" role="img" aria-labelledby="process-mobile-dark-title process-mobile-dark-desc"><title id="process-mobile-dark-title">skillprov process</title><desc id="process-mobile-dark-desc">The clean fixture passes; undeclared capabilities reject the poisoned fixture.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="400" y2="685"><stop stop-color="#e6a856"/><stop offset=".6" stop-color="#dae76a"/><stop offset="1" stop-color="#f6bbac"/></linearGradient><radialGradient id="halo"><stop stop-color="#e6a856" stop-opacity=".22"/><stop offset="1" stop-color="#0a0a0d" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3a2d1d" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#e6a856" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="400" height="685" rx="16" fill="#0a0a0d"/><rect width="400" height="685" rx="16" fill="url(#grid)"/><ellipse cx="252.0" cy="294.55" rx="200.0" ry="479.49999999999994" fill="url(#halo)"/><text x="28" y="44" fill="#b2ada8" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="28" y="84.0" fill="#fdf1ee" font-size="25" text-anchor="start" font-weight="400">skillprov / example</text><text x="28" y="119.0" fill="#fdf1ee" font-size="25" text-anchor="start" font-weight="400">workflow</text><path d="M200 257V290" fill="none" stroke="#e6a856" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 257V290" class="flow" fill="none" stroke="#f6bbac" stroke-width="2"/><rect x="28" y="135" width="344" height="122" rx="12" fill="#131417" stroke="#3a2d1d"/><text x="46" y="166.0" fill="#fdf1ee" font-size="21" text-anchor="start" font-weight="400">01  Copy fixtures</text><text x="46" y="218.0" fill="#b2ada8" font-size="17" text-anchor="start" font-weight="400">Temporary safe and poisoned</text><text x="46" y="241.8" fill="#b2ada8" font-size="17" text-anchor="start" font-weight="400">sets</text><path d="M200 412V445" fill="none" stroke="#e6a856" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 412V445" class="flow" fill="none" stroke="#f6bbac" stroke-width="2"/><rect x="28" y="290" width="344" height="122" rx="12" fill="#131417" stroke="#3a2d1d"/><text x="46" y="321.0" fill="#fdf1ee" font-size="21" text-anchor="start" font-weight="400">02  Manifest and sign</text><text x="46" y="373.0" fill="#b2ada8" font-size="17" text-anchor="start" font-weight="400">Fresh local demo key</text><rect x="28" y="445" width="344" height="122" rx="12" fill="#131417" stroke="#3a2d1d"/><text x="46" y="476.0" fill="#fdf1ee" font-size="21" text-anchor="start" font-weight="400">03  Verify both</text><text x="46" y="528.0" fill="#b2ada8" font-size="17" text-anchor="start" font-weight="400">PASS and REJECTED</text><text x="28" y="620.0" fill="#f6bbac" font-size="18" text-anchor="start" font-weight="400">The clean fixture passes;</text><text x="28" y="645.2" fill="#f6bbac" font-size="18" text-anchor="start" font-weight="400">undeclared capabilities reject…</text></svg>
