name: demo

on:
  workflow_dispatch: {}
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build binary for the demo
        run: go build -o /usr/local/bin/skillprov .
      - name: Install vhs + deps (ffmpeg, ttyd, vhs)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -fsSL -o /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd
          go install github.com/charmbracelet/vhs@latest
      - name: Render demo.gif
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          vhs docs/demo.tape
      - name: Commit rendered gif
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -f assets/demo.gif
          git commit -m "chore: render demo gif" || { echo "no change"; exit 0; }
          # A tag push checks out a detached HEAD, where a bare `git push`
          # fails with "You are not currently on a branch" (the v0.5.0/v0.6.0/
          # v0.8.0 tag runs failed exactly this way whenever the re-rendered
          # gif differed; v0.7.0 passed only because the gif was
          # byte-identical). Push the commit onto main explicitly instead —
          # the gif is maintained on main; from a main checkout HEAD:main is
          # the same push it always was.
          git push origin HEAD:main
